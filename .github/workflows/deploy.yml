name: Deploy to GitHub Pages

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:
  build-resume-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Typst template (Nunjucks)
        run: |
          node scripts/1.compile-nunjucks-template.js

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Export Typst to PDF
        run: |
          bash scripts/2.export-typst-to-pdf.sh typst/out/WongZhaoWu-resume.typ

      - name: Copy PDF to static
        run: |
          cp typst/out/WongZhaoWu-resume.pdf ./static/WongZhaoWu-resume.pdf

      - name: Upload resume PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: ./static/WongZhaoWu-resume.pdf
          if-no-files-found: error

  build-site:
    needs: build-resume-pdf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download resume PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf
          path: ./static

      - name: build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: |
          pnpm build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # this should match the `pages` option in your adapter-static options
          path: 'build/'

  deploy:
    needs: build-site
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
